name: Publish YaugerAIO to PowerShell Gallery

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Enter PUBLISH to release version 1.5.1 from the repair branch"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/fix/psgallery-1.5.1' && inputs.confirm == 'PUBLISH'
    runs-on: windows-latest

    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v5

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop

      - name: Run maintenance and module tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.7.1 -Force -ErrorAction Stop
          $result = Invoke-Pester -Path ./Tests -Output Detailed -PassThru
          if ($result.FailedCount -gt 0 -or $result.TotalCount -eq 0) {
            throw "Pester failed or did not discover any tests."
          }

      - name: Build the PowerShell Gallery package
        shell: pwsh
        run: |
          $release = Join-Path $PWD 'release/YaugerAIO'
          New-Item -Path $release -ItemType Directory -Force | Out-Null

          foreach ($file in @('YaugerAIO.psd1', 'YaugerAIO.psm1', 'YaugerAIO.ps1', 'README.md', 'LICENSE')) {
            Copy-Item -LiteralPath (Join-Path $PWD $file) -Destination $release -ErrorAction Stop
          }

          $module = Test-ModuleManifest -Path (Join-Path $release 'YaugerAIO.psd1') -ErrorAction Stop
          if ($module.Version.ToString() -ne '1.5.1') {
            throw "Unexpected module version $($module.Version); expected 1.5.1."
          }

          $expected = @('YaugerAIO', 'Start-YaugerAIOWorkflow')
          foreach ($name in $expected) {
            if ($module.ExportedCommands.Keys -notcontains $name) {
              throw "Required command $name was not exported by the release package."
            }
          }

      - name: Publish version 1.5.1
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PSGALLERY_API_KEY)) {
            throw "The PSGALLERY_API_KEY GitHub Actions secret is not configured."
          }

          $release = Join-Path $PWD 'release/YaugerAIO'
          Publish-Module -Path $release -Repository PSGallery -NuGetApiKey $env:PSGALLERY_API_KEY -ErrorAction Stop
